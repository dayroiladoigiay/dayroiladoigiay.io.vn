<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐÂY RỒI LÀ ĐÔI GIÀY</title>
    <style>
        /* Fix thanh cuộn và tối ưu tốc độ */
        html, body { background-color: #000; color: #ff6600; font-family: Arial, sans-serif; margin: 0; padding: 0; min-height: 100vh; overflow-y: auto !important; }
        h1 { color: #ff6600; text-transform: uppercase; margin: 15px 0; font-size: 20px; text-align: center; }
        
        .tabs { display: flex; overflow-x: auto; gap: 8px; padding: 10px; background: #111; position: sticky; top: 0; z-index: 100; border-bottom: 2px solid #ff6600; }
        .tab-btn { background: #222; color: #fff; border: 1px solid #444; padding: 8px 15px; cursor: pointer; font-weight: bold; white-space: nowrap; border-radius: 4px; }
        .tab-btn.active { background: #ff6600; color: #000; border-color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 15px; }
        @media (min-width: 600px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); } }
        
        .card { background: #111; border: 1px solid #333; padding: 8px; border-radius: 8px; transition: 0.3s; }
        .card:hover { border-color: #ff6600; }
        .card img { width: 100%; border-radius: 5px; aspect-ratio: 1/1; object-fit: cover; background: #222; display: block; }
        .card p { margin: 10px 0 0; font-size: 13px; font-weight: bold; color: #ff6600; text-align: center; }
        
        /* Modal chi tiết */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; overflow-y: auto; }
        .modal-content { display: flex; flex-direction: column; align-items: center; gap: 15px; padding: 60px 10px 20px; }
        .modal-content img { width: 100%; max-width: 500px; border: 1px solid #ff6600; border-radius: 5px; }
        .close-btn { position: fixed; top: 15px; right: 15px; font-size: 16px; color: #fff; cursor: pointer; background: #ff6600; padding: 10px 20px; border-radius: 5px; font-weight: bold; z-index: 1001; }
    </style>
</head>
<body>

    <h1>ĐÂY RỒI LÀ ĐÔI GIÀY</h1>
    <div class="tabs" id="tabs"></div>
    <h2 id="size-title" style="font-size: 16px; margin: 20px 0; text-align: center;">CHỌN SIZE ĐỂ XEM HÀNG</h2>
    <div class="grid" id="grid"></div>

    <div id="modal">
        <span class="close-btn" onclick="closeModal()">QUAY LẠI [X]</span>
        <div class="modal-content" id="modal-images"></div>
    </div>

    <script>
        const config = {
            "37": 10, "37.5": 0, "38": 10, "38.5": 0, "39": 0, "40": 0, 
            "40.5": 0, "41": 0, "42": 45, "42.5": 0, "43": 0, "44": 0, 
            "44.5": 0, "45": 0, "46": 0, "47": 0, "48": 0
        };

        const tabs = document.getElementById('tabs');
        const grid = document.getElementById('grid');
        const sizeTitle = document.getElementById('size-title');

        Object.keys(config).forEach(size => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            btn.innerText = `SIZE ${size}`;
            btn.onclick = () => loadSize(size, btn);
            tabs.appendChild(btn);
        });

        function loadSize(size, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            sizeTitle.innerText = `KHO GIÀY SIZE ${size}`;
            grid.innerHTML = 'Đang tải ảnh...';

            setTimeout(() => { // Tạo độ trễ nhỏ để tránh giật lag khi chuyển size
                grid.innerHTML = '';
                const count = config[size];
                if (count === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; color: #888;">Size này hiện đang hết hàng.</p>';
                    return;
                }

                for (let i = 1; i <= count; i++) {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openModal(size, i);
                    card.innerHTML = `
                        <img src="img/size${size}/${i}/1.jpg" loading="lazy" alt="Giày" onerror="this.parentElement.style.display='none'">
                        <p>Mẫu số ${i}</p>
                    `;
                    grid.appendChild(card);
                }
            }, 100);
        }

        function openModal(size, id) {
            const modal = document.getElementById('modal');
            const container = document.getElementById('modal-images');
            container.innerHTML = 'Đang tải ảnh chi tiết...';
            modal.style.display = 'block';
            
            setTimeout(() => {
                container.innerHTML = '';
                for (let j = 1; j <= 6; j++) {
                    const img = document.createElement('img');
                    img.src = `img/size${size}/${id}/${j}.jpg`;
                    img.loading = "lazy";
                    img.onerror = function() { this.style.display='none'; }; 
                    container.appendChild(img);
                }
            }, 200);
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }
    </script>
</body>
</html>
